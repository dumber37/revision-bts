<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Révisions BTS MCO</title>
  <meta name="description" content="Fiches, visuels, QCM et jeux pour réviser le BTS MCO.">
  <meta name="theme-color" content="#172340">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Révisions MCO">
  <!-- Thème enregistré appliqué avant l'affichage, pour éviter un flash clair en mode sombre. -->
  <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
    var a = JSON.parse(localStorage.getItem('revision-affichage') || '{}');
    if (a.taille) document.documentElement.style.fontSize = a.taille + '%';
    if (a.confort) document.documentElement.className += ' confort'; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Police chargée sans bloquer l'affichage (réseau lent, hors-ligne) : la police système s'affiche en attendant. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"></noscript>
  <link rel="stylesheet" href="style.css?v=27">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">Révisions <span>BTS MCO</span></a>
    <span class="topbar-droite">
      <a class="niveau-chip" id="niveau" href="#/profil" aria-label="Mon niveau et mes badges"></a>
      <button class="theme-btn aa" id="affBtn" type="button" aria-label="Taille du texte et confort de lecture">Aa</button>
      <button class="theme-btn" id="sonBtn" type="button" aria-label="Couper les sons">🔊</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème">◐</button>
    </span>
  </header>

  <main id="app" class="page"></main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" type="button" aria-label="Fermer">×</button>
    <button class="lb-nav lb-prec" type="button" data-pas="-1" aria-label="Image précédente">‹</button>
    <button class="lb-nav lb-suiv" type="button" data-pas="1" aria-label="Image suivante">›</button>
    <img alt="">
    <p class="lb-caption"></p>
  </div>

  <!-- Données : une matière par fichier. Ajouter une fiche = modifier le fichier de la matière. -->

  <script src="jeux.js?v=27"></script>

</html>
