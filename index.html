<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Révisions BTS MCO</title>
  <!-- Thème enregistré appliqué avant l'affichage, pour éviter un flash clair en mode sombre. -->
  <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">Révisions <span>BTS MCO</span></a>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Changer de thème">◐</button>
  </header>

  <main id="app" class="page"></main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" type="button" aria-label="Fermer">×</button>
    <button class="lb-nav lb-prec" type="button" data-pas="-1" aria-label="Image précédente">‹</button>
    <button class="lb-nav lb-suiv" type="button" data-pas="1" aria-label="Image suivante">›</button>
    <img alt="">
    <p class="lb-caption"></p>
  </div>

  <!-- Données : une matière par fichier. Ajouter une fiche = modifier le fichier de la matière. -->
  <script src="data/matieres.js?v=9"></script>
  <script src="data/drcv.js?v=9"></script>
  <script src="data/adoc.js?v=9"></script>
  <script src="data/management.js?v=9"></script>
  <script src="data/gestion.js?v=9"></script>
  <script src="data/formules.js?v=9"></script>
  <script src="composants.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
